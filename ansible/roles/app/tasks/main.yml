---
# 2주차 보안 변형 A: 이미지 무결성 게이트
#
# 1주차는 "서버에 같은 태그가 이미 있으면" 로드를 건너뛰었다.
# 그러면 누군가 같은 태그(minjun-app:v4-xxxx)로 다른 이미지를 미리 심어 두면 그대로 실행된다.
# 태그는 이름표일 뿐 내용을 보증하지 않는다.
#
# 그래서 매번 CI가 만든 아카이브를 로드하고, 로드 전/후 이미지 ID를 비교한다.
#   - 전 ID 없음           → 처음 받는 이미지. 통과
#   - 전 ID == 후 ID       → 서버에 있던 것이 CI 산출물과 같다. 통과
#   - 전 ID != 후 ID       → 이 서버의 태그가 CI 산출물이 아닌 이미지를 가리키고 있었다. 기록하고 중단
# 비교는 같은 서버의 docker 안에서 하므로 저장소 방식(containerd/classic)에 따른 ID 차이가 없다.

- name: Image ID under the deploy tag (before load)
  community.docker.docker_image_info:
    name: "{{ app_image }}:{{ image_tag }}"
  register: img_before

- name: Ensure my staging dir
  ansible.builtin.file:
    path: "{{ app_stage_dir }}"
    state: directory
    mode: "0750"

- name: Copy image archive (CI artifact)
  ansible.builtin.copy:
    src: "{{ image_archive }}"
    dest: "{{ app_stage_dir }}/{{ app_image }}-{{ image_tag }}.tar.gz"
    mode: "0640"

- name: Load image into docker
  community.docker.docker_image_load:
    path: "{{ app_stage_dir }}/{{ app_image }}-{{ image_tag }}.tar.gz"

- name: Remove archive after load
  ansible.builtin.file:
    path: "{{ app_stage_dir }}/{{ app_image }}-{{ image_tag }}.tar.gz"
    state: absent

- name: Image ID under the deploy tag (after loading CI artifact)
  community.docker.docker_image_info:
    name: "{{ app_image }}:{{ image_tag }}"
  register: img_after

- name: Compare
  ansible.builtin.set_fact:
    id_before: "{{ img_before.images[0].Id if (img_before.images | length > 0) else '' }}"
    id_after: "{{ img_after.images[0].Id }}"

- name: Record tamper in audit log
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/audit.yml"
  vars:
    audit_event: TAMPER_DETECTED
    audit_extra:
      found: "{{ id_before }}"
      expected: "{{ id_after }}"
  when: id_before != '' and id_before != id_after

- name: Integrity gate — tag must point to the CI artifact
  ansible.builtin.assert:
    that: id_before == '' or id_before == id_after
    fail_msg: >-
      TAMPER: {{ app_image }}:{{ image_tag }} on {{ inventory_hostname }} pointed to {{ id_before }},
      but the CI artifact is {{ id_after }}. Not starting a container from it.
    success_msg: "integrity ok ({{ 'first load' if id_before == '' else 'matches CI artifact' }})"

# 이미지 태그가 바뀌면 컨테이너를 다시 만들고, 같으면 그대로 둔다 (멱등).
- name: Run {{ app_container }} on host port {{ app_port }}
  community.docker.docker_container:
    name: "{{ app_container }}"
    image: "{{ app_image }}:{{ image_tag }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ app_port }}:8080"
    env:
      APP_HOST: "{{ inventory_hostname }}"
      APP_COLOR: "{{ app_color }}"
      APP_PORT: "{{ app_port | string }}"
    labels:
      owner: "{{ owner }}"
      color: "{{ app_color }}"

- name: Wait until /health is OK on this server
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    status_code: 200
    timeout: 2
  register: health
  until: health.status == 200
  retries: 15
  delay: 2

- name: Check /version matches what we deployed
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/version"
    return_content: true
  register: ver
  failed_when: ver.json.version != app_version
